name: Deploy Grand Store to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production VPS (191.215.37.241)
    runs-on: ubuntu-latest

    steps:
      - name: Connect via SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '191.215.37.241'
          username: 'root'
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            echo "=========================================================="
            echo "🚀 Starting Automated Deployment to Production"
            echo "Host: 191.215.37.241"
            echo "Date: $(date)"
            echo "=========================================================="

            # 1. Navigate to Project
            cd /var/www/grandstore-all

            # 2. Pull Latest Commits
            echo "📥 Pulling latest code from main..."
            git pull origin main

            # 3. Update Backend and Reload PM2
            echo "📦 Installing Backend Dependencies & Reloading PM2..."
            cd /var/www/grandstore-all/grand-store/backend
            npm ci --omit=dev || npm install --omit=dev
            pm2 reload grandstore-backend || pm2 restart grandstore-backend

            # 4. Build Frontend
            echo "🎨 Building Frontend..."
            cd /var/www/grandstore-all/grand-store/frontend
            npm ci || npm install
            npm run build

            # 5. Reload Nginx
            echo "🌐 Testing and Reloading Nginx..."
            nginx -t
            systemctl reload nginx

            echo "=========================================================="
            echo "✅ Deployment Succeeded!"
            echo "Live URL: https://grandstoreglobal.com"
            echo "API URL:  https://api.grandstoreglobal.com"
            echo "=========================================================="
